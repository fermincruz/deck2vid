[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deck2vid"
version = "0.1.0"
description = "Build narrated explanatory videos from PDF slides and VoxCPM scripts"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0", "PyMuPDF>=1.24", "rich>=13.0", "typer>=0.12", "soundfile>=0.12", "numpy>=1.24"]

[project.scripts]
deck2vid = "deck2vid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]